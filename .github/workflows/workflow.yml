name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  # 使用 toLower 函数将仓库名转为小写
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  RepositoryName: ci-cd-example


jobs:
  # ==================== CI 阶段 ====================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  # ==================== CD - 构建镜像 ====================
  build-image:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{env.RepositoryName}}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=inline
          cache-to: type=inline

  # ==================== CD - 部署到测试环境 ====================
  deploy-staging:
    needs: [build-image]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          script: |
            # 登录容器镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取最新镜像（使用小写仓库名）
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{env.RepositoryName}}:latest

            # 停止并删除旧容器
            docker stop ${{env.RepositoryName}} || true
            docker rm ${{env.RepositoryName}} || true

            # 启动新容器（使用小写仓库名）
            docker run -d --name ${{env.RepositoryName}} -p 8080:8080 --restart=always ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{env.RepositoryName}}:latest

            # 清理旧镜像
            docker image prune -f

